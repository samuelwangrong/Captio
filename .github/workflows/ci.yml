name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck, unit & integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build extension
        # Generates apps/extension/.plasmo (needed for typecheck) and
        # apps/extension/build/chrome-mv3-dev (needed by e2e tests).
        run: pnpm build:extension

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit

      - name: Integration tests
        run: pnpm test:integration

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build extension
        run: pnpm build:extension

      - name: Install Playwright browsers
        run: pnpm --filter extension exec playwright install --with-deps chromium

      - name: E2E tests
        # No Supabase env vars are configured here, so apps/extension/test/e2e/auth-relay.spec.ts's
        # main case skips itself (see fixtures.ts's hasSupabaseCredentials) rather than
        # exercising the real sign-in relay. To actually cover that path in CI, add
        # PLASMO_PUBLIC_SUPABASE_URL/PLASMO_PUBLIC_SUPABASE_ANON_KEY as repo secrets
        # (a real or disposable test Supabase project works — this test never signs in
        # for real, it only needs a client that isn't constructed with undefined args)
        # and pass them to both this step and "Build extension" above.
        run: pnpm test:e2e
